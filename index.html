        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return hash;
        }

        async function fetchTexture(texName, transparent = false) {
            return new Promise((resolve) => {
                textureLoader.load(
                    `${TEXTURE_CDN}${texName}.png`, 
                    (tex) => {
                        tex.magFilter = THREE.NearestFilter;
                        tex.minFilter = THREE.NearestFilter;
                        tex.colorSpace = THREE.SRGBColorSpace;
                        const matConfig = { map: tex, alphaTest: 0.1 };
                        if (transparent) {
                            matConfig.transparent = true;
                            matConfig.opacity = 0.9;
                        }
                        resolve(new THREE.MeshLambertMaterial(matConfig));
                    },
                    undefined, 
                    () => { 
                        let color = Math.abs(hashCode(texName)) % 0xffffff;
                        const matConfig = { color: color };
                        if (transparent) {
                            matConfig.transparent = true;
                            matConfig.opacity = 0.9;
                        }
                        resolve(new THREE.MeshLambertMaterial(matConfig));
                    }
                );
            });
        }

        async function loadMaterials(paletteList, statusElement) {
            let loadedCount = 0;
            await Promise.all(paletteList.map(async (blockName) => {
                if (materialCache[blockName]) {
                    loadedCount++;
                    statusElement.innerHTML = `Mengunduh Tekstur & Model: ${loadedCount} / ${paletteList.length}`;
                    return;
                }
                
                const config = BLOCK_REGISTRY[blockName] || { textures: blockName.replace('minecraft:', '').split('[')[0] };
                
                if (config.skip) {
                    materialCache[blockName] = null;
                    loadedCount++;
                    return;
                }
                
                if (Array.isArray(config.textures)) {
                    const materials = await Promise.all(config.textures.map(tex => fetchTexture(tex, config.transparent)));
                    materialCache[blockName] = materials;
                } else {
                    materialCache[blockName] = await fetchTexture(config.textures, config.transparent);
                }
                
                loadedCount++;
                statusElement.innerHTML = `Mengunduh Tekstur & Model: ${loadedCount} / ${paletteList.length}`;
            }));
        }

        // --- 3. ROTASI BLOK BERDASARKAN FACING DIRECTION ---
        function getBlockRotation(block, config) {
            const rotation = new THREE.Euler(0, 0, 0);
            
            if (!config.rotatable || !block.states) {
                return rotation;
            }

            // Mapping facing direction ke rotasi
            const facing = block.states.minecraft_facing_direction ?? 
                          block.states.facing_direction ??
                          block.states.minecraft_vertical_half;
            
            if (facing !== undefined) {
                switch(facing) {
                    case 0: rotation.x = Math.PI / 2; break; // Down
                    case 1: rotation.x = -Math.PI / 2; break; // Up
                    case 2: rotation.y = Math.PI; break; // North
                    case 3: rotation.y = 0; break; // South
                    case 4: rotation.y = Math.PI / 2; break; // West
                    case 5: rotation.y = -Math.PI / 2; break; // East
                }
            }
            
            return rotation;
        }

        // --- 4. BEDROCK NBT PARSER ---
        class BedrockNBTReader {
            constructor(buffer) {
                this.view = new DataView(buffer);
                this.offset = 0;
                this.decoder = new TextDecoder('utf-8');
            }
            readByte() { const v = this.view.getInt8(this.offset); this.offset += 1; return v; }
            readShort() { const v = this.view.getInt16(this.offset, true); this.offset += 2; return v; }
            readInt() { const v = this.view.getInt32(this.offset, true); this.offset += 4; return v; }
            readLong() { this.offset += 8; return 0; } 
            readFloat() { const v = this.view.getFloat32(this.offset, true); this.offset += 4; return v; }
            readDouble() { const v = this.view.getFloat64(this.offset, true); this.offset += 8; return v; }
            readByteArray() { const len = this.readInt(); this.offset += len; return []; }
            readString() {
                const len = this.readShort();
                const str = this.decoder.decode(new Uint8Array(this.view.buffer, this.offset, len));
                this.offset += len;
                return str;
            }
            readIntArray() { const len = this.readInt(); this.offset += (len * 4); return []; }
            readTag(type) {
                switch(type) {
                    case 1: return this.readByte();
                    case 2: return this.readShort();
                    case 3: return this.readInt();
                    case 4: return this.readLong();
                    case 5: return this.readFloat();
                    case 6: return this.readDouble();
                    case 7: return this.readByteArray();
                    case 8: return this.readString();
                    case 9: 
                        const listType = this.readByte();
                        const len = this.readInt();
                        const list = [];
                        for(let i=0; i<len; i++) list.push(this.readTag(listType));
                        return list;
                    case 10: 
                        const obj = {};
                        while(true) {
                            const tagType = this.readByte();
                            if (tagType === 0) break;
                            const name = this.readString();
                            obj[name] = this.readTag(tagType);
                        }
                        return obj;
                    case 11: return this.readIntArray();
                    default: throw new Error(`Tipe Tag NBT tidak didukung: ${type}`);
                }
            }
            parse() {
                let rootType = this.readByte();
                let failsafe = 0;
                while (rootType !== 10 && failsafe < 20) {
                    rootType = this.readByte();
                    failsafe++;
                }
                if (rootType !== 10) throw new Error("Format tidak valid.");
                this.readString(); 
                return this.readTag(10);
            }
        }

        // --- 5. DATA EXTRACTION & RENDER EXECUTION ---
        let parsedBlocksData = [];
        let activeMeshes = [];

        function updateRenderLayer(maxLayer) {
            activeMeshes.forEach(mesh => scene.remove(mesh));
            activeMeshes = [];
            
            const visibleBlocks = parsedBlocksData.filter(b => b.y <= maxLayer);
            if (visibleBlocks.length === 0) return;

            const groupedBlocks = {};
            visibleBlocks.forEach(b => {
                if (!groupedBlocks[b.name]) groupedBlocks[b.name] = [];
                groupedBlocks[b.name].push(b);
            });

            for (const [blockId, blocks] of Object.entries(groupedBlocks)) {
                const config = BLOCK_REGISTRY[blockId] || {};
                
                if (config.skip) continue;
                
                const geometry = config.geometry || defaultGeometry;
                const material = materialCache[blockId];
                
                if (!material) continue;

                blocks.forEach((block) => {
                    const position = new THREE.Vector3(block.x, block.y, block.z);
                    const rotation = getBlockRotation(block, config);
                    const scale = new THREE.Vector3(1, 1, 1);

                    if (config.offset) {
                        position.x += config.offset[0];
                        position.y += config.offset[1];
                        position.z += config.offset[2];
                    }

                    const quaternion = new THREE.Quaternion().setFromEuler(rotation);
                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.applyMatrix4(matrix);
                    scene.add(mesh);
                    activeMeshes.push(mesh);
                });
            }
        }

        // --- 6. FILE UPLOAD HANDLER ---
        const fileUpload = document.getElementById('file-upload');
        const statusText = document.getElementById('status');
        const layerSlider = document.getElementById('layer-slider');
        const layerVal = document.getElementById('layer-val');

        fileUpload.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            statusText.style.color = '#ccc';
            statusText.innerHTML = "Membedah struktur NBT...";
            
            const buffer = await file.arrayBuffer();
            
            try {
                const nbtReader = new BedrockNBTReader(buffer);
                const nbtData = nbtReader.parse();

                const size = nbtData.size;
                const structureSize = { x: size[0], y: size[1], z: size[2] };
                const palette = nbtData.structure.palette.default.block_palette; 
                
                parsedBlocksData = [];

                for (let layer = 0; layer < nbtData.structure.block_indices.length; layer++) {
                    const blockIndices = nbtData.structure.block_indices[layer];
                    
                    for (let i = 0; i < blockIndices.length; i++) {
                        const paletteIndex = blockIndices[i];
                        if (paletteIndex === undefined || paletteIndex < 0) continue;
                        
                        const blockState = palette[paletteIndex];
                        if (!blockState) continue;
                        
                        const config = BLOCK_REGISTRY[blockState.name] || {};
                        if (config.skip || blockState.name === 'minecraft:air') continue;

                        const z = i % structureSize.z;
                        const y = Math.floor(i / structureSize.z) % structureSize.y;
                        const x = Math.floor(i / (structureSize.y * structureSize.z));

                        parsedBlocksData.push({ 
                            x, y, z, 
                            name: blockState.name, 
                            states: blockState.states 
                        });
                    }
                }

                const uniqueBlocks = [...new Set(parsedBlocksData.map(b => b.name))];
                await loadMaterials(uniqueBlocks, statusText);

                controls.target.set(structureSize.x / 2, structureSize.y / 2, structureSize.z / 2);
                camera.position.set(structureSize.x * 1.5, structureSize.y * 1.5, structureSize.z * 1.5);
                
                layerSlider.disabled = false;
                layerSlider.max = structureSize.y - 1;
                layerSlider.value = structureSize.y - 1;
                layerVal.innerText = structureSize.y - 1;

                updateRenderLayer(structureSize.y - 1);
                
                statusText.style.color = '#4CAF50';
                statusText.innerHTML = `✓ Sempurna! ${uniqueBlocks.length} jenis blok dimuat.`;

            } catch (error) {
                console.error(error);
                statusText.style.color = '#ff5555';
                statusText.innerHTML = `Gagal: ${error.message}`;
            }
        });

        layerSlider.addEventListener('input', (e) => {
            const currentLayer = parseInt(e.target.value);
            layerVal.innerText = currentLayer;
            updateRenderLayer(currentLayer);
        });

        document.getElementById('ui-container').addEventListener('pointerdown', (e) => e.stopPropagation());

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
